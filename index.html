<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello Brady</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #1f2933;
      background: #f4f7fb;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 720px);
      background: #ffffff;
      border: 1px solid #d9e2ec;
      border-radius: 8px;
      padding: 40px;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 6vw, 4rem);
      line-height: 1;
    }

    p {
      margin: 0;
      font-size: 1.1rem;
      line-height: 1.6;
      color: #52606d;
    }

    .tagline {
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid #e4e7eb;
      color: #3e4c59;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello, Brady</h1>
    <p>Welcome to your first HTML page in this project.</p>
    <p class="tagline">hello word - hello brady</p>
  </main>
</body>
</html>
